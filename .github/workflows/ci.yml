name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q envlens.py tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
        exclude:
          - os: macos-latest
            python: '3.9'
          - os: windows-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Run suite
        run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean environment exits 0
        run: python envlens.py check --example examples/.env.example --actual examples/.env.example
      - name: Drift exits 1
        run: |
          set +e
          python envlens.py check --example examples/.env.example --actual examples/.env
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      - name: JSON is parseable
        run: python envlens.py check --example examples/.env.example --actual examples/.env --format json | python -m json.tool > /dev/null
      - name: Mask hides secrets
        run: |
          out=$(python envlens.py mask examples/.env)
          echo "$out"
          echo "$out" | grep -q 'DEBUG_TOKEN=loca' || { echo "secret leaked unmasked"; exit 1; }

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here. A maintainer reads every one.

            To get a useful answer fast, add: what you ran, what you expected, what happened, and your version.
          pr-message: |
            First PR here — welcome.

            CI runs automatically. Before review: rebase on `main`, keep it to one change,
            and use a Conventional Commit title (`feat:`, `fix:`, `docs:`). CONTRIBUTING.md has the rest.

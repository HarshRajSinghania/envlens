name: Bug report
description: Something is broken or exits non-zero when it should not
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search open issues first. A duplicate gets closed and your context is lost.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `envlens --version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Linux x86_64, Linux arm64, macOS arm64, macOS x86_64, Windows, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands. Smallest input that triggers it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Full output, not a truncated screenshot.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Regression? Worked in an earlier version? Bisect result?
    validations:
      required: false

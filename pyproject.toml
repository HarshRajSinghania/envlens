[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envlens"
version = "0.1.0"
description = "Detect env-file drift before it breaks a deploy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "your-handle" }]
keywords = ["dotenv", "env", "configuration", "cli", "devops"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
envlens = "envlens:main"

[project.urls]
Homepage = "https://github.com/your-handle/envlens"
Issues = "https://github.com/your-handle/envlens/issues"
Changelog = "https://github.com/your-handle/envlens/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["envlens"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_ignores = true
